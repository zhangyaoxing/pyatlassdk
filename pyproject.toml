[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyatlassdk"
version = "0.1.0"
description = "Python SDKs for the MongoDB Atlas Administration and App Services Admin APIs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yaoxing" }]
keywords = ["mongodb", "atlas", "sdk", "api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1",
  "pydantic>=2.14.1",
]

[project.urls]
Homepage = "https://github.com/zhangyaoxing/pyatlassdk"
Repository = "https://github.com/zhangyaoxing/pyatlassdk"
Issues = "https://github.com/zhangyaoxing/pyatlassdk/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyatlassdk"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Generated modules are owned by mongo-atlas-sdk; do not lint or format them here.
extend-exclude = [
  "src/pyatlassdk/admin",
  "src/pyatlassdk/app",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
